name: React Doctor

on:
  pull_request:
    branches: [main]

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for diffing against the base branch

      - name: React Doctor (PR comment)
        uses: millionco/react-doctor@v2
        with:
          scope: changed

      - name: React Doctor (annotations)
        if: always()
        run: npx -y react-doctor@latest . --scope changed --base origin/main --annotations --verbose
